name: aeki-development
services:
  postgres:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: aeki_development
      POSTGRES_USER: aeki_development
      POSTGRES_PASSWORD: aeki_development_only
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aeki_development -d aeki_development']
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
