openapi: 3.0.3
info:
  title: AEKI API
  version: 0.1.0
  description: API liveness contract. Database readiness is a separate future operation.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the API process is reachable
      responses:
        "200":
          description: The API process is alive. This does not establish database readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: aeki-api
  /readiness:
    get:
      operationId: getReadiness
      summary: Report current database connectivity independently of process liveness
      responses:
        "200":
          description: A real database connectivity query succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database connectivity failed or exceeded its deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotReadyResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          enum:
            - aeki-api
    ReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum:
            - ready
        database:
          type: string
          enum:
            - reachable
    NotReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - code
      properties:
        status:
          type: string
          enum:
            - not_ready
        database:
          type: string
          enum:
            - unreachable
        code:
          type: string
          enum:
            - DATABASE_UNAVAILABLE
            - DATABASE_TIMEOUT
    ReadinessResponse:
      oneOf:
        - $ref: "#/components/schemas/ReadyResponse"
        - $ref: "#/components/schemas/NotReadyResponse"
