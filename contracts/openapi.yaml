openapi: 3.0.3
info:
  title: AEKI API
  version: 0.1.0
  description: API process liveness and separate database readiness contracts.
paths:
  /products:
    get:
      operationId: searchProducts
      summary: Search products by name or article number
      description: Case-insensitive substring matching with stable name and product-ID ordering. Stock is indicative and tied to the identified store.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            pattern: '\S'
      responses:
        '200':
          description: Matching products, including an empty collection when there are no matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResponse'
              examples:
                results:
                  value:
                    items:
                      - id: product-linden-chair
                        name: LINDEN chair
                        articleNumber: '00012345'
                        description: A wooden dining chair.
                        image:
                          url: /images/products/linden-chair.svg
                          alt: A wooden LINDEN dining chair
                        price:
                          amountMinor: 1299000
                          currency: HUF
                        stock:
                          storeId: store-budapest
                          storeName: Budapest
                          quantity: 7
                empty:
                  value: {items: []}
        '503':
          description: Product search is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchErrorResponse'
              example: {code: PRODUCT_SEARCH_UNAVAILABLE}
  /health:
    get:
      operationId: getHealth
      summary: Report whether the API process is reachable
      responses:
        '200':
          description: The API process is alive. This does not establish database readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: aeki-api
  /readiness:
    get:
      operationId: getReadiness
      summary: Report current database connectivity independently of process liveness
      responses:
        '200':
          description: A real database connectivity query succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Database connectivity failed or exceeded its deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyResponse'
components:
  schemas:
    Product:
      type: object
      additionalProperties: false
      required: [id, name, articleNumber, description, image, price, stock]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        articleNumber: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        image:
          type: object
          additionalProperties: false
          required: [url, alt]
          properties:
            url: {type: string, minLength: 1}
            alt: {type: string, minLength: 1}
        price:
          type: object
          additionalProperties: false
          required: [amountMinor, currency]
          properties:
            amountMinor:
              type: integer
              minimum: 0
              description: Amount in the specified currency's minor units; use its standard fractional precision when formatting.
            currency: {type: string, pattern: '^[A-Z]{3}$'}
        stock:
          type: object
          additionalProperties: false
          required: [storeId, storeName, quantity]
          properties:
            storeId: {type: string, minLength: 1}
            storeName: {type: string, minLength: 1}
            quantity: {type: integer, minimum: 0}
    ProductSearchResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    ProductSearchErrorResponse:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, enum: [PRODUCT_SEARCH_UNAVAILABLE]}
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          enum:
            - aeki-api
    ReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum:
            - ready
        database:
          type: string
          enum:
            - reachable
    NotReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - code
      properties:
        status:
          type: string
          enum:
            - not_ready
        database:
          type: string
          enum:
            - unreachable
        code:
          type: string
          enum:
            - DATABASE_UNAVAILABLE
            - DATABASE_TIMEOUT
    ReadinessResponse:
      oneOf:
        - $ref: '#/components/schemas/ReadyResponse'
        - $ref: '#/components/schemas/NotReadyResponse'
