name: AEKI CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: aeki-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          cache: npm
      - name: Use the project npm version
        run: npm install --global npm@11.16.0
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Docker Compose availability
        run: docker compose version
      - name: Verify formatting, contracts, code and full coverage
        run: npm run check
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/
            !coverage/processes/tmp/
          if-no-files-found: warn
          retention-days: 14
