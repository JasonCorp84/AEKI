function store(){return `<select class="select" aria-label="Choose store" data-control="store">${['Budapest · Budaörs','Budapest · Örs vezér tere','Budapest · Soroksár'].map(s=>`<option ${s===state.store?'selected':''}>${s}</option>`).join('')}</select>`}
function sort(){return `<select class="select" aria-label="Sort products" data-control="sort"><option value="recommended" ${state.sort==='recommended'?'selected':''}>Recommended</option><option value="price-asc" ${state.sort==='price-asc'?'selected':''}>Price: low to high</option><option value="price-desc" ${state.sort==='price-desc'?'selected':''}>Price: high to low</option></select>`}
function results(){let list=products.filter(p=>(p.type+' '+p.name+' '+`100.20${p.id}`).toLowerCase().includes(state.query.trim().toLowerCase()));if(state.category!=='All')list=list.filter(p=>p.category===state.category);if(state.available)list=list.filter(p=>p.stock>0);if(state.sort==='price-asc')list.sort((a,b)=>a.price-b.price);if(state.sort==='price-desc')list.sort((a,b)=>b.price-a.price);return list}
function card(p){return `<article class="product-card"><div class="art-wrap" data-detail="${p.id}" tabindex="0" role="button" aria-label="View ${p.name}">${art(p)}${p.tag?`<span class="tag">${p.tag}</span>`:''}<button class="heart ${state.saved.includes(p.id)?'saved':''}" data-save="${p.id}" aria-label="${state.saved.includes(p.id)?'Unsave':'Save'} ${p.name}" aria-pressed="${state.saved.includes(p.id)}">${icon('heart')}</button></div><div class="info"><button class="product-name" data-detail="${p.id}">${p.name}</button><p class="product-desc">${p.type} · ${p.color}</p><div class="price-row"><span class="price">${price(p.price)}</span>${stock(p)}</div></div></article>`}
function blank(list){if(state.screen==='loading')return `<div class="grid" aria-label="Loading products">${Array.from({length:3},()=>'<div class="skeleton"></div>').join('')}</div>`;if(state.screen==='waiting'||!state.query.trim())return `<div class="empty"><h2>What are you looking for?</h2><p>Start with a product, a name or an article number.</p></div>`;if(state.screen==='error')return `<div class="empty" role="alert"><h2>A small pause.</h2><p>We couldn't load the products. Your search is still here.</p><button class="pill filled" data-action="retry">Try again</button></div>`;if(state.screen==='empty'||!list.length)return `<div class="empty"><h2>A little too specific?</h2><p>Try a broader search or clear a filter.</p><button class="pill" data-action="reset">Reset search</button></div>`;return ''}
function VariantA(){const list=results();return `<div class="variant-a">${header()}<section class="hero"><div><span class="caps muted">Made for everyday living</span><h1>A little change.<br/>A better everyday.</h1><p>Thoughtful furniture. Familiar prices. Find what feels like home.</p></div><div class="hero-tools">${search()}<p>Try “chair”, “table” or an article number.</p></div></section><div class="category-strip">${['All','Chairs','Tables'].map(c=>`<button class="pill ${state.category===c?'filled':''}" data-category="${c}">${c==='All'?'All products':c}</button>`).join('')}<button class="pill" data-action="room">Shop by room ${icon('arrow')}</button></div><section class="catalog"><aside><p class="caps">Make it yours</p><h3>Your store</h3>${store()}<label class="check stock-check"><input type="checkbox" data-control="available" ${state.available?'checked':''}> Available in store</label><h3>Material</h3><p class="muted" style="font-size:12px;line-height:1.8">Natural wood<br/>Soft upholstery<br/>Mixed materials</p><h3>Good to know</h3><p class="muted" style="font-size:11px;line-height:1.8">Store availability helps you plan your visit.</p></aside><div><div class="meta-top"><span class="count">${list.length} products · ${state.query?`“${escapeHtml(state.query)}”`:'Start a search'}</span>${sort()}</div>${blank(list)||`<div class="grid">${list.map(card).join('')}</div>`}<div class="editorial-strip"><div><strong>Good design, less guesswork.</strong><span>Check your local store before you head out.</span></div>${icon('pin')}</div><footer class="section-footer"><span>Designed for real life.</span><span>AEKI · Everyday, considered.</span></footer></div></section></div>`}
function VariantB(){const list=results();return `<div class="variant-b">${header()}<div class="workspace"><aside><h2>Your product shortlist</h2>${['All','Chairs','Tables'].map(c=>`<button class="sidebar-tab ${state.category===c?'chosen':''}" data-category="${c}"><span>${c==='All'?'All products':c}</span><span>${c==='All'?8:c==='Chairs'?6:2}</span></button>`).join('')}<p class="caps">Check a store</p>${store()}<label class="check"><input type="checkbox" data-control="available" ${state.available?'checked':''}> Available only</label><p class="caps">Your favourites</p><button class="sidebar-tab" data-action="saved">Saved products <span>${state.saved.length}</span></button><p style="font-size:11px;color:#798170;line-height:1.8;margin-top:50px">Less scrolling.<br/>More useful detail.</p></aside><section class="workspace-main"><div class="titleline"><div><span class="caps muted">Find. Compare. Decide.</span><h1 style="margin-top:8px">Furniture, without the fuss.</h1><p>Compare prices and local availability in one place.</p></div>${sort()}</div>${search()}<div class="mobile-tools">${store()}<label class="check"><input type="checkbox" data-control="available" ${state.available?"checked":""}> Available only</label></div><div class="summary"><span><strong>${list.length}</strong> results</span><span><strong>${list.filter(p=>p.stock>0).length}</strong> available</span><span><strong>${state.saved.length}</strong> saved</span></div>${blank(list)||`<div class="tablehead"><span>Product</span><span>Details</span><span>Price</span><span>Availability</span><span></span></div>${list.map(p=>`<article class="table-row"><div class="row-art" role="button" tabindex="0" data-detail="${p.id}" aria-label="View ${p.name}">${art(p)}</div><div><button class="product-name" data-detail="${p.id}">${p.name}</button><p class="product-desc">${p.type} · ${p.color}</p><p class="article">Article no. 100.20${p.id}</p><div class="mobile-stock">${stock(p)}</div></div><span class="price">${price(p.price)}</span>${stock(p)}<button class="row-actions" data-save="${p.id}" aria-label="Save ${p.name}" aria-pressed="${state.saved.includes(p.id)}">${state.saved.includes(p.id)?'✓':'+'}</button></article>`).join('')}`}<footer class="section-footer"><span>${state.store}</span><span>Stock is indicative.</span></footer></section></div></div>`}
function roomScene(){return `<svg class="room-svg" viewBox="0 0 700 500" aria-label="Illustrated living room with chair, lamp and table" role="img"><path d="M0 340h700v160H0" fill="#c3cbb6"/><path d="M610 0v340" stroke="#9ca891"/><rect x="478" y="60" width="120" height="154" fill="#dce4d0" stroke="#b5beab" stroke-width="8"/><path d="M538 60v154M478 137h120" stroke="#b5beab" stroke-width="5"/><ellipse cx="375" cy="402" rx="252" ry="47" fill="#e7e6d0"/><path d="M140 201q50-20 105 0l-6 102H145Z" fill="#7b8b69"/><path d="M125 284q65-18 128 0l-7 43H135Z" fill="#748562"/><path d="m146 325-8 77m94-77 13 77" stroke="#a28b66" stroke-width="11"/><path d="M110 266v50m150-50v50" stroke="#7b8b69" stroke-width="19" stroke-linecap="round"/><ellipse cx="390" cy="309" rx="89" ry="24" fill="#b99970"/><path d="m324 322-12 77m143-77 13 77m-76-67v62" stroke="#b99970" stroke-width="10"/><path d="M320 172v230m-26 0h52" stroke="#766d57" stroke-width="5"/><path d="m282 172 20-43h39l21 43Z" fill="#f1ebd7"/><path d="M485 369h42l-4 40h-35Z" fill="#b88164"/><path d="M506 369v-77m0 40q-60-10-42-36 37 0 42 36m0-13q-12-59 11-57 23 24-11 57m0 29q56-49 63-16-22 29-63 16" fill="#6d8060" stroke="#6d8060" stroke-width="3"/><circle cx="193" cy="270" r="17" class="scene-dot"/><path d="M187 270h12m-6-6v12" stroke="#53634b" stroke-width="1.5"/><circle cx="390" cy="309" r="17" class="scene-dot"/><path d="M384 309h12m-6-6v12" stroke="#53634b" stroke-width="1.5"/></svg>`}
function VariantC(){const list=results();const featured=list.find(p=>p.room===state.room)||list[0];return `<div class="variant-c">${header()}<div class="room-layout"><section class="room-scene"><div class="scene-copy"><span class="caps">Spaces with a little soul</span><h1>Make room<br/>for slow Sundays.</h1><p>A favourite corner. A good book.<br/>The pieces that bring it together.</p></div><div class="room-picker">${['Living','Dining','Workspace'].map(r=>`<button class="${state.room===r?'chosen':''}" data-room="${r}">${r}</button>`).join('')}</div>${roomScene()}<div class="scene-caption"><span>01 / A quieter corner</span><span>Find your kind of home ${icon('arrow')}</span></div></section><section class="room-content"><span class="caps muted">Start with one good piece</span><h2>Your room, your rhythm.</h2>${search()}<div class="filterline">${store()}<button class="pill ${state.available?'filled':''}" data-action="availability">Available only</button></div>${blank(list)||(featured?`<article class="featured-item"><div class="art-wrap" data-detail="${featured.id}" tabindex="0" role="button" aria-label="View ${featured.name}">${art(featured)}</div><div class="featured-copy"><span class="caps muted">For your ${state.room.toLowerCase()} space</span><h3>${featured.name}</h3><p>${featured.type} in ${featured.color.toLowerCase()}. An easy addition to your everyday.</p><div class="price">${price(featured.price)}</div>${stock(featured)}<div style="margin-top:22px"><button class="text-link" data-detail="${featured.id}">Take a closer look ${icon('arrow')}</button></div></div></article><div class="shortlist"><h3>Other pieces to consider <span class="muted">(${list.length})</span></h3>${list.filter(p=>p.id!==featured.id).map(p=>`<article class="mini-item"><div class="art-wrap" data-detail="${p.id}" role="button" tabindex="0" aria-label="View ${p.name}">${art(p)}</div><div><button class="product-name" data-detail="${p.id}">${p.name}</button><p class="product-desc">${p.type}</p></div><div style="text-align:right"><span class="price">${price(p.price)}</span><div style="margin-top:7px">${stock(p)}</div></div></article>`).join('')}</div>`:'')}<footer class="section-footer"><span>One piece at a time.</span><span>AEKI.</span></footer></section></div></div>`}
function statePanel(){document.getElementById('state-panel').innerHTML=`<h3>UI prototype · relevant state</h3><pre>${escapeHtml(JSON.stringify({...state,visibleProductIds:results().map(p=>p.id),dataSource:'in-memory visual stub'},null,2))}</pre>`}
function render(){document.getElementById('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC})[state.variant]();if(DEV)document.getElementById('switcher').innerHTML=`<nav class="prototype-bar" aria-label="Prototype variations"><button class="switch-arrow" data-cycle="-1" aria-label="Previous variant">←</button><div class="variant-name"><div class="caps">UI prototype · ${state.variant} / 3</div><span>${names[state.variant]}</span></div><button class="switch-arrow" data-cycle="1" aria-label="Next variant">→</button><select aria-label="Preview UI state" id="preview-screen">${['results','waiting','loading','empty','error'].map(s=>`<option ${state.screen===s?'selected':''}>${s}</option>`).join('')}</select><button class="state-button" data-action="state" aria-expanded="${!document.getElementById('state-panel').hidden}">State</button></nav>`;statePanel();if(DEV)console.info("AEKI UI prototype state",JSON.stringify({...state,visibleProductIds:results().map(p=>p.id)}))}
function cycle(delta){state.variant=variants[(variants.indexOf(state.variant)+delta+3)%3];const url=new URL(location);url.searchParams.set('variant',state.variant);history.replaceState({},'',url);render()}
let debounce;document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;state.screen=state.query.trim()?'results':'waiting';clearTimeout(debounce);debounce=setTimeout(()=>{const focused=document.activeElement?.id==='search';const pos=e.target.selectionStart;render();if(focused){const input=document.getElementById('search');input.focus();input.setSelectionRange(pos,pos)}},300);statePanel()}});
document.addEventListener('change',e=>{if(e.target.id==='preview-screen')state.screen=e.target.value;if(e.target.dataset.control){const key=e.target.dataset.control;state[key]=key==='available'?e.target.checked:e.target.value;}render()});
function toast(text){document.getElementById('toast-root').innerHTML=`<div class="toast">${text}</div>`;setTimeout(()=>document.getElementById('toast-root').innerHTML='',2200)}
function showDetail(id){const p=products.find(p=>p.id===id);state.detail=id;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-title"><button class="close-modal" data-action="close" aria-label="Close product details">×</button><div class="art-wrap">${art(p)}</div><div class="modal-copy"><span class="caps">Article no. 100.20${p.id}</span><h2 id="detail-title">${p.name}</h2><span class="product-desc">${p.type} · ${p.color}</span><p>A thoughtful piece for everyday living. Simple lines, a welcoming feel and room to make it yours.</p><div class="price">${price(p.price)}</div>${stock(p)}<p style="font-size:11px">${state.store}<br/>${p.stock} available · Indicative demo stock</p><button class="pill filled" data-save="${p.id}">${state.saved.includes(p.id)?'Remove from favourites':'Save to favourites'}</button></div></section></div>`;document.querySelector('.close-modal').focus();statePanel()}
document.addEventListener('click',e=>{const button=e.target.closest('button,[data-detail],a');if(!button)return;if(button.tagName==='A')e.preventDefault();if(button.dataset.cycle){cycle(Number(button.dataset.cycle));return}if(button.dataset.save){const id=Number(button.dataset.save);state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render();if(state.detail)showDetail(state.detail);return}if(button.dataset.detail){showDetail(Number(button.dataset.detail));return}if(button.dataset.category){state.category=button.dataset.category;render();return}if(button.dataset.room){state.room=button.dataset.room;render();return}switch(button.dataset.action){case'clear':state.query='';state.screen='waiting';render();document.getElementById('search').focus();break;case'retry':state.screen='results';render();break;case'reset':case'home':case'all':state.query='chair';state.category='All';state.available=false;state.screen='results';render();break;case'availability':state.available=!state.available;render();break;case'state':document.getElementById('state-panel').hidden=!document.getElementById('state-panel').hidden;render();break;case'close':state.detail=null;document.getElementById('modal-root').innerHTML='';statePanel();break;case'room':state.variant='B';cycle(1);break;case'saved':toast(`${state.saved.length} saved ${state.saved.length===1?'product':'products'} in this preview.`);break;case'account':toast('Account styling preview · no sign-in required.');break;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.detail){state.detail=null;document.getElementById('modal-root').innerHTML='';statePanel();return}if(e.target.matches('input,textarea,select,[contenteditable="true"]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}if((e.key==='Enter'||e.key===' ')&&e.target.dataset.detail){e.preventDefault();showDetail(Number(e.target.dataset.detail))}});
window.addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');state.variant=variants.includes(v)?v:'A';render()});
render();
</script>
</body>
</html>
