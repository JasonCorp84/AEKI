<!doctype html>
<!-- THROWAWAY: Three structurally different AEKI search UIs on /prototype/search-ui?variant=A|B|C.
Question: Which hierarchy makes product discovery, store availability and comparison easiest to understand?
All data and interactions are in-memory visual stubs. No API, authentication or reservations. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AEKI · Find your everyday</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
      :root {
        --ink: #242a24;
        --muted: #747a70;
        --paper: #f7f7f1;
        --green: #293d2e;
        --line: #dddeda;
        --accent: #eced97;
        font-family: 'DM Sans', Arial, sans-serif;
        color: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      select {
        cursor: pointer;
      }
      button {
        color: inherit;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #bd7b28;
        outline-offset: 4px;
      }
      button {
        border: 0;
        background: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      svg {
        display: block;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        font-family: Manrope, Arial, sans-serif;
      }
      input,
      select {
        min-width: 0;
      }
      header {
        height: 94px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5vw;
        border-bottom: 1px solid var(--line);
      }
      .wordmark {
        font:
          800 33px Manrope,
          Arial;
        letter-spacing: -2px;
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .brand-dot {
        width: 10px;
        height: 10px;
        background: #c9ce71;
        border-radius: 50%;
        align-self: flex-end;
        margin-bottom: 9px;
      }
      .nav {
        display: flex;
        gap: 32px;
        font-size: 14px;
      }
      .nav .active {
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 9px;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 13px;
      }
      .icon {
        width: 19px;
        height: 19px;
        display: inline-block;
        vertical-align: middle;
      }
      .caps {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 700;
      }
      .muted {
        color: var(--muted);
      }
      .pill {
        border: 1px solid var(--line);
        padding: 9px 15px;
        border-radius: 22px;
        font-size: 12px;
        white-space: nowrap;
      }
      .filled {
        background: var(--green);
        color: white;
        border-color: var(--green);
      }
      .searchbox {
        display: flex;
        align-items: center;
        background: white;
        border: 1px solid var(--line);
        gap: 14px;
        padding: 14px 18px;
        border-radius: 8px;
      }
      .searchbox input {
        border: 0;
        outline: none;
        background: none;
        flex: 1;
        font-size: 15px;
        width: 100%;
      }
      .searchbox button {
        font-size: 12px;
      }
      .select {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 11px;
        background: transparent;
        font-size: 12px;
        max-width: 100%;
      }
      .filterline {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .product-art {
        width: 100%;
        height: 100%;
        min-height: 100px;
      }
      .art-wrap {
        position: relative;
        background: #eceee6;
        overflow: hidden;
      }
      .heart {
        position: absolute;
        right: 13px;
        top: 13px;
        background: #fff9;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        z-index: 1;
      }
      .heart.saved {
        background: var(--green);
        color: white;
      }
      .stock {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
      }
      .stock:before {
        content: '';
        width: 6px;
        height: 6px;
        background: #57825b;
        border-radius: 50%;
      }
      .stock.low:before {
        background: #b58030;
      }
      .stock.none {
        color: #8b8b85;
      }
      .stock.none:before {
        background: #a1a19a;
      }
      .price {
        font:
          700 20px Manrope,
          Arial;
        letter-spacing: -0.8px;
      }
      .small-price {
        font-size: 10px;
        letter-spacing: 0;
        font-weight: 500;
        margin-left: 3px;
      }
      .product-name {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.6px;
      }
      .product-desc {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .tag {
        position: absolute;
        left: 14px;
        top: 14px;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: #fff8;
        padding: 6px 8px;
        border-radius: 3px;
      }
      .meta-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 26px;
      }
      .count {
        font-size: 12px;
        color: var(--muted);
      }
      .text-link {
        font-size: 12px;
        border-bottom: 1px solid;
        padding-bottom: 4px;
      }
      .empty {
        padding: 80px 20px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 10px;
      }
      .empty h2 {
        font-size: 24px;
        margin-bottom: 12px;
      }
      .empty p {
        font-size: 14px;
        color: var(--muted);
      }
      .empty button {
        margin-top: 18px;
      }
      .skeleton {
        height: 300px;
        background: linear-gradient(
          100deg,
          #e8e9e2 20%,
          #f6f7f0 45%,
          #e8e9e2 70%
        );
        background-size: 250% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 5px;
      }
      @keyframes shimmer {
        to {
          background-position: -150% 0;
        }
      }
      .toast {
        position: fixed;
        top: 110px;
        right: 30px;
        background: var(--green);
        color: white;
        border-radius: 7px;
        padding: 14px 20px;
        font-size: 13px;
        z-index: 10;
      }
      .section-footer {
        display: flex;
        justify-content: space-between;
        padding: 30px 0 0;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
        margin-top: 42px;
      }
      .prototype-bar {
        position: fixed;
        bottom: 17px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        background: #202620;
        color: white;
        border-radius: 15px;
        padding: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 8px 35px #0003;
        font-size: 12px;
        max-width: calc(100% - 20px);
      }
      .prototype-bar .switch-arrow {
        color: white;
        width: 34px;
        height: 35px;
        border-radius: 8px;
        background: #ffffff10;
        font-size: 20px;
      }
      .variant-name {
        white-space: nowrap;
        width: 158px;
        text-align: center;
      }
      .prototype-bar .caps {
        font-size: 8px;
        color: #b4bfad;
        letter-spacing: 1.5px;
      }
      .prototype-bar select {
        background: #353d34;
        color: white;
        border: 1px solid #566150;
        border-radius: 6px;
        padding: 8px;
        font-size: 11px;
        max-width: 100px;
      }
      .state-button {
        color: #d5dfcc;
        font-size: 10px;
        border-left: 1px solid #566150;
        padding-left: 12px;
      }
      .state-panel {
        position: fixed;
        bottom: 82px;
        right: 20px;
        background: #fff;
        color: #222;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 18px;
        z-index: 31;
        max-width: 350px;
        width: calc(100% - 40px);
        box-shadow: 0 5px 20px #0002;
      }
      .state-panel pre {
        white-space: pre-wrap;
        font-size: 11px;
        line-height: 1.5;
      }
      .state-panel h3 {
        font-size: 13px;
      }
      .state-panel[hidden] {
        display: none;
      }
      footer {
        margin-bottom: 110px;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: #14251977;
        backdrop-filter: blur(5px);
        z-index: 40;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .modal {
        background: var(--paper);
        border-radius: 12px;
        max-width: 800px;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow: hidden;
        position: relative;
      }
      .modal .art-wrap {
        min-height: 370px;
      }
      .modal-copy {
        padding: 40px 30px;
      }
      .modal-copy h2 {
        font-size: 30px;
        margin: 10px 0;
      }
      .modal-copy p {
        font-size: 14px;
        line-height: 1.7;
        color: var(--muted);
        margin: 16px 0;
      }
      .close-modal {
        position: absolute;
        right: 12px;
        top: 12px;
        background: white;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        z-index: 2;
      }
      .modal-copy .price {
        margin: 20px 0;
      }
      .modal-copy .pill {
        margin-top: 22px;
        display: block;
      }
      .modal-copy .caps {
        color: #73796b;
      }
      /* A: warm shopping catalog, sidebar filters and an image-led product grid. */
      .variant-a .hero {
        padding: 46px 5vw 34px;
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 70px;
        align-items: end;
      }
      .variant-a .hero h1 {
        font-size: clamp(34px, 4vw, 53px);
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -2.5px;
        max-width: 570px;
        margin: 12px 0 18px;
      }
      .variant-a .hero p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.6;
      }
      .variant-a .hero-tools {
        padding-bottom: 7px;
      }
      .variant-a .hero-tools > p {
        font-size: 11px;
        margin-top: 12px;
      }
      .variant-a .category-strip {
        margin: 0 5vw 36px;
        display: flex;
        gap: 10px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      .variant-a .catalog {
        display: grid;
        grid-template-columns: 176px 1fr;
        gap: 34px;
        padding: 0 5vw;
      }
      .variant-a aside .caps {
        margin-bottom: 18px;
      }
      .variant-a aside h3 {
        font-size: 12px;
        margin: 26px 0 14px;
      }
      .check {
        display: flex;
        gap: 9px;
        align-items: center;
        font-size: 12px;
        margin: 12px 0;
        color: #5c6357;
      }
      .check input {
        accent-color: var(--green);
      }
      .variant-a aside .select {
        width: 100%;
      }
      .variant-a .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 27px 20px;
      }
      .product-card .art-wrap {
        aspect-ratio: 1.07;
        cursor: pointer;
      }
      .product-card .info {
        padding-top: 15px;
      }
      .product-card .price-row {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin-top: 16px;
      }
      .variant-a .editorial-strip {
        padding: 22px 24px;
        background: #e8eddf;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 32px;
        font-size: 12px;
      }
      .variant-a .editorial-strip strong {
        display: block;
        font: 600 18px Manrope;
        margin-bottom: 4px;
      }
      /* B: inventory-first workspace with a quiet utility sidebar and dense table. */
      .variant-b {
        background: #fcfcfa;
        min-height: 100vh;
      }
      .variant-b header {
        background: #232d28;
        color: #f4f5ec;
        border: none;
        height: 76px;
      }
      .variant-b .brand-dot {
        background: #d3de87;
      }
      .variant-b .workspace {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: calc(100vh - 76px);
      }
      .variant-b aside {
        border-right: 1px solid #deded5;
        background: #f1f3eb;
        padding: 35px 25px;
      }
      .variant-b aside h2 {
        font-size: 14px;
        letter-spacing: -0.4px;
        margin-bottom: 25px;
      }
      .variant-b aside .sidebar-tab {
        display: flex;
        width: 100%;
        justify-content: space-between;
        padding: 12px 13px;
        font-size: 12px;
        border-radius: 5px;
        margin-bottom: 5px;
        text-align: left;
      }
      .variant-b aside .sidebar-tab.chosen {
        background: #dfe6d4;
        font-weight: 700;
      }
      .variant-b aside .select {
        width: 100%;
        margin-bottom: 10px;
      }
      .variant-b aside .caps {
        margin: 32px 0 12px;
        color: #6d7567;
      }
      .variant-b .workspace-main {
        padding: 38px 38px 110px;
      }
      .variant-b .titleline {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 29px;
      }
      .variant-b h1 {
        font-size: 34px;
        letter-spacing: -1.5px;
      }
      .variant-b .titleline p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 9px;
      }
      .variant-b .searchbox {
        max-width: 540px;
        margin-bottom: 24px;
        background: white;
      }
      .variant-b .summary {
        display: flex;
        gap: 35px;
        font-size: 12px;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        margin-bottom: 18px;
      }
      .variant-b .summary strong {
        font: 700 19px Manrope;
        margin-right: 6px;
      }
      .variant-b .tablehead,
      .variant-b .table-row {
        display: grid;
        grid-template-columns: 80px minmax(190px, 1fr) 120px 110px 50px;
        align-items: center;
        gap: 12px;
      }
      .variant-b .tablehead {
        font-size: 9px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        padding: 12px 0;
      }
      .variant-b .table-row {
        padding: 16px 0;
        border-top: 1px solid #e6e7df;
      }
      .variant-b .row-art {
        height: 75px;
        background: #eceee6;
        border-radius: 5px;
        cursor: pointer;
      }
      .variant-b .table-row .product-name {
        font-size: 12px;
      }
      .variant-b .table-row .price {
        font-size: 16px;
      }
      .variant-b .article {
        font-size: 10px;
        color: #8a8e85;
        margin-top: 8px;
      }
      .variant-b .row-actions {
        font-size: 18px;
        background: #f0f3e8;
        border-radius: 50%;
        height: 30px;
        width: 30px;
      }
      .variant-b .count {
        margin: 8px 0;
      }
      .mobile-stock,
      .mobile-tools {
        display: none;
      }
      /* C: editorial room-first exploration, featured item and horizontal shortlist. */
      .variant-c {
        background: #f6efe5;
        min-height: 100vh;
      }
      .variant-c header {
        border-color: #dcd2c4;
      }
      .variant-c .room-layout {
        display: grid;
        grid-template-columns: 1.08fr 1fr;
        min-height: calc(100vh - 94px);
        padding-bottom: 100px;
      }
      .variant-c .room-scene {
        position: sticky;
        top: 0;
        background: #d8e0d0;
        height: calc(100vh - 94px);
        min-height: 650px;
        overflow: hidden;
      }
      .variant-c .scene-copy {
        position: absolute;
        top: 42px;
        left: 45px;
        z-index: 1;
      }
      .variant-c .scene-copy h1 {
        font: 500 clamp(38px, 4vw, 58px)/1.05 Manrope;
        letter-spacing: -2.5px;
        max-width: 350px;
        margin-top: 16px;
      }
      .variant-c .scene-copy p {
        font-size: 13px;
        margin-top: 18px;
        max-width: 250px;
        line-height: 1.6;
        color: #5e6857;
      }
      .variant-c .scene-caption {
        position: absolute;
        bottom: 26px;
        left: 35px;
        right: 35px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        border-top: 1px solid #68795466;
        padding-top: 16px;
      }
      .variant-c .room-svg {
        position: absolute;
        bottom: 50px;
        width: 100%;
        height: 440px;
      }
      .variant-c .room-content {
        padding: 42px 38px;
      }
      .variant-c .room-content h2 {
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -1px;
        margin: 8px 0 22px;
      }
      .variant-c .searchbox {
        background: #fff7;
        border-color: #d6cabc;
      }
      .variant-c .filterline {
        margin: 15px 0 25px;
      }
      .variant-c .featured-item {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        border-top: 1px solid #dcd2c4;
        padding: 24px 0;
      }
      .variant-c .featured-item .art-wrap {
        min-height: 190px;
        background: #e9dfd1;
        border-radius: 70% 70% 0 0;
      }
      .variant-c .featured-copy {
        padding-top: 18px;
      }
      .variant-c .featured-copy h3 {
        font-size: 19px;
        margin: 10px 0;
      }
      .variant-c .featured-copy p {
        font-size: 12px;
        line-height: 1.6;
        color: #807666;
        margin-bottom: 18px;
      }
      .variant-c .featured-copy .stock {
        margin-top: 14px;
      }
      .variant-c .shortlist {
        border-top: 1px solid #dcd2c4;
        padding-top: 20px;
      }
      .variant-c .shortlist h3 {
        font-size: 13px;
        margin-bottom: 15px;
      }
      .variant-c .mini-item {
        display: grid;
        grid-template-columns: 60px 1fr auto;
        gap: 16px;
        align-items: center;
        border-bottom: 1px solid #e0d5c7;
        padding: 12px 0;
      }
      .variant-c .mini-item .art-wrap {
        height: 62px;
        background: #e9e0d5;
      }
      .variant-c .mini-item .price {
        font-size: 14px;
      }
      .variant-c .mini-item .product-name {
        font-size: 11px;
      }
      .variant-c .scene-dot {
        fill: #f6efe5;
        stroke: #737c63;
        stroke-width: 1.5;
      }
      .variant-c .room-picker {
        position: absolute;
        top: 300px;
        left: 45px;
        display: flex;
        gap: 8px;
        z-index: 1;
      }
      .variant-c .room-picker button {
        background: #f6efe5aa;
        border-radius: 20px;
        padding: 9px 15px;
        font-size: 11px;
      }
      .variant-c .room-picker .chosen {
        background: #293d2e;
        color: white;
      }
      @media (min-width: 1550px) {
        .variant-a .grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .variant-a .hero,
        .variant-a .catalog {
          max-width: 1550px;
          margin: auto;
        }
        .variant-a .category-strip {
          max-width: 1395px;
          margin-left: auto;
          margin-right: auto;
        }
      }
      @media (max-width: 1050px) {
        .nav {
          gap: 17px;
        }
        .variant-a .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .variant-b .workspace {
          grid-template-columns: 170px 1fr;
        }
        .variant-b aside {
          padding: 25px 15px;
        }
        .variant-b .workspace-main {
          padding: 30px 24px 110px;
        }
        .variant-b .tablehead,
        .variant-b .table-row {
          grid-template-columns: 65px minmax(125px, 1fr) 85px 95px 32px;
          gap: 8px;
        }
        .variant-c .room-content {
          padding: 32px 24px;
        }
        .variant-c .scene-copy {
          left: 28px;
        }
        .variant-c .featured-item {
          gap: 12px;
        }
        .variant-c .featured-item .art-wrap {
          min-height: 150px;
        }
      }
      @media (max-width: 700px) {
        header {
          height: 75px;
          padding: 0 20px;
        }
        .wordmark {
          font-size: 28px;
        }
        .nav {
          display: none;
        }
        .header-actions {
          font-size: 11px;
          gap: 10px;
        }
        .variant-a .hero {
          display: block;
          padding: 30px 20px 20px;
        }
        .variant-a .hero h1 {
          font-size: 38px;
        }
        .variant-a .hero-tools {
          margin-top: 24px;
        }
        .variant-a .category-strip {
          margin: 0 20px 24px;
          overflow: auto;
          flex-wrap: nowrap;
        }
        .variant-a .catalog {
          display: block;
          padding: 0 20px;

        String(untrustedText).replace(

            (firstProduct, secondProduct) =>

            (firstProduct, secondProduct) =>
              secondProduct.price - firstProduct.price,

        return visibleProducts;

        if (isDevelopmentPreview)
          document.getElementById('switcher').innerHTML =
            `<nav class="prototype-bar" aria-label="Prototype variations"><button class="switch-arrow" data-cycle="-1" aria-label="Previous variant">←</button><div class="variant-name"><div class="caps">UI prototype · ${prototypeState.variant} / 3</div><span>${variantNames[prototypeState.variant]}</span></div><button class="switch-arrow" data-cycle="1" aria-label="Next variant">→</button><select aria-label="Preview UI state" id="preview-screen">${['results', 'waiting', 'loading', 'empty', 'error'].map(screenName => `<option ${prototypeState.screen === screenName ? 'selected' : ''}>${screenName}</option>`).join('')}</select><button class="state-button" data-action="state" aria-expanded="${!document.getElementById('state-panel').hidden}">State</button></nav>`;
        renderStatePanel();
        if (isDevelopmentPreview)
          console.info(
            'AEKI UI prototype state',
            JSON.stringify({
              ...prototypeState,
              visibleProductIds: getVisibleProducts().map(
                product => product.id,
              ),
            }),
          );
      }
      function changePrototypeVariant(variantStep) {
        prototypeState.variant =
          prototypeVariants[
            (prototypeVariants.indexOf(prototypeState.variant) +
              variantStep +
              3) %
              3
          ];
        const variantUrl = new URL(location);
        variantUrl.searchParams.set('variant', prototypeState.variant);
        history.replaceState({}, '', variantUrl);
        renderPrototype();
      }
      let searchDebounceTimer;
      document.addEventListener('input', function handleSearchInput(event) {
        if (event.target.id === 'search') {
          prototypeState.query = event.target.value;
          prototypeState.screen = prototypeState.query.trim()
            ? 'results'
            : 'waiting';
          clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(() => {
            const hasSearchFocus = document.activeElement?.id === 'search';
            const cursorPosition = event.target.selectionStart;
            renderPrototype();
            if (hasSearchFocus) {
              const searchInputElement = document.getElementById('search');
              searchInputElement.focus();
              searchInputElement.setSelectionRange(
                cursorPosition,
                cursorPosition,
              );
            }
          }, 300);
          renderStatePanel();
        }
      });
      document.addEventListener('change', function handleFilterChange(event) {
        if (event.target.id === 'preview-screen')
          prototypeState.screen = event.target.value;
        if (event.target.dataset.control) {
          const controlProperty = event.target.dataset.control;
          prototypeState[controlProperty] =
            controlProperty === 'available'
              ? event.target.checked
              : event.target.value;
        }
        renderPrototype();
      });
      function showToast(text) {
        document.getElementById('toast-root').innerHTML =
          `<div class="toast">${text}</div>`;
        setTimeout(
          () => (document.getElementById('toast-root').innerHTML = ''),
          2200,
        );
      }
      function showProductDetails(productId) {
        const product = products.find(product => product.id === productId);
        prototypeState.detail = productId;
        document.getElementById('modal-root').innerHTML =
          `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-title"><button class="close-modal" data-action="close" aria-label="Close product details">×</button><div class="art-wrap">${renderProductIllustration(product)}</div><div class="modal-copy"><span class="caps">Article no. 100.20${product.id}</span><h2 id="detail-title">${product.name}</h2><span class="product-desc">${product.type} · ${product.color}</span><p>A thoughtful piece for everyday living. Simple lines, a welcoming feel and room to make it yours.</p><div class="price">${renderPrice(product.price)}</div>${renderStockAvailability(product)}<p style="font-size:11px">${prototypeState.store}<br/>${product.stock} available · Indicative demo stock</p><button class="pill filled" data-save="${product.id}">${prototypeState.saved.includes(product.id) ? 'Remove from favourites' : 'Save to favourites'}</button></div></section></div>`;
        document.querySelector('.close-modal').focus();
        renderStatePanel();
      }
      document.addEventListener('click', function handlePrototypeAction(event) {
        const clickedActionElement = event.target.closest(
          'button,[data-detail],a',
        );
        if (!clickedActionElement) return;
        if (clickedActionElement.tagName === 'A') event.preventDefault();
        if (clickedActionElement.dataset.cycle) {
          changePrototypeVariant(Number(clickedActionElement.dataset.cycle));
          return;
        }
        if (clickedActionElement.dataset.save) {
          const productId = Number(clickedActionElement.dataset.save);
          prototypeState.saved = prototypeState.saved.includes(productId)
            ? prototypeState.saved.filter(
                savedProductId => savedProductId !== productId,
              )
            : [...prototypeState.saved, productId];
          renderPrototype();
          if (prototypeState.detail) showProductDetails(prototypeState.detail);
          return;
        }
        if (clickedActionElement.dataset.detail) {
          showProductDetails(Number(clickedActionElement.dataset.detail));
          return;
        }
        if (clickedActionElement.dataset.category) {
          prototypeState.category = clickedActionElement.dataset.category;
          renderPrototype();
          return;
        }
        if (clickedActionElement.dataset.room) {
          prototypeState.room = clickedActionElement.dataset.room;
          renderPrototype();
          return;
        }
        switch (clickedActionElement.dataset.action) {
          case 'clear':
            prototypeState.query = '';
            prototypeState.screen = 'waiting';
            renderPrototype();
            document.getElementById('search').focus();
            break;
          case 'retry':
            prototypeState.screen = 'results';
            renderPrototype();
            break;
          case 'reset':
          case 'home':
          case 'all':
            prototypeState.query = 'chair';
            prototypeState.category = 'All';
            prototypeState.available = false;
            prototypeState.screen = 'results';
            renderPrototype();
            break;
          case 'availability':
            prototypeState.available = !prototypeState.available;
            renderPrototype();
            break;
          case 'state':
            document.getElementById('state-panel').hidden =
              !document.getElementById('state-panel').hidden;
            renderPrototype();
            break;
          case 'close':
            prototypeState.detail = null;
            document.getElementById('modal-root').innerHTML = '';
            renderStatePanel();
            break;
          case 'room':
            prototypeState.variant = 'B';
            changePrototypeVariant(1);
            break;
          case 'saved':
            showToast(
              `${prototypeState.saved.length} saved ${prototypeState.saved.length === 1 ? 'product' : 'products'} in this preview.`,
            );
            break;
          case 'account':
            showToast('Account styling preview · no sign-in required.');
            break;
        }
      });
      document.addEventListener(
        'keydown',
        function handleKeyboardNavigation(event) {
          if (event.key === 'Escape' && prototypeState.detail) {
            prototypeState.detail = null;
            document.getElementById('modal-root').innerHTML = '';
            renderStatePanel();
            return;
          }
          if (
            event.target.matches(
              'input,textarea,select,[contenteditable="true"]',
            )
          )
            return;
          if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
            event.preventDefault();
            changePrototypeVariant(event.key === 'ArrowLeft' ? -1 : 1);
          }
          if (
            (event.key === 'Enter' || event.key === ' ') &&
            event.target.dataset.detail
          ) {
            event.preventDefault();
            showProductDetails(Number(event.target.dataset.detail));
          }
        },
      );
      window.addEventListener(
        'popstate',
        function restoreVariantFromLocation() {
          const requestedVariant = new URLSearchParams(location.search).get(
            'variant',
          );
          prototypeState.variant = prototypeVariants.includes(requestedVariant)
            ? requestedVariant
            : 'A';
          renderPrototype();
        },
      );
      renderPrototype();
    </script>
  </body>
</html>
